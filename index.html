    --t-gemeinschaft: #e0824a;

    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17233a; --bg-2:#1f2f4a; --card:#22314d; --ink:#fdfaf3; --ink-dim:#b7c0d4; --line: rgba(253,250,243,0.14);

  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(47,155,179,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(224,130,74,0.10), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, sans-serif;
    line-height: 1.55;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  h1, h2, h3 { font-family: 'Fredoka', 'Work Sans', sans-serif; font-weight: 600; margin: 0; }

  /* ---------- Progress ---------- */
  .progress-track {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    height: 3px;
    background: var(--line);
    margin-bottom: 40px;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--gold));
    width: 0%;
    transition: width .4s ease;
  }

  /* ---------- Screens ---------- */
  .screen { display: none; animation: rise .5s ease both; }
  .screen.active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .eyebrow-leaf { font-size: 28px; margin-bottom: 18px; display:block; }
  .hero h1 { font-size: clamp(32px, 7vw, 44px); line-height: 1.12; letter-spacing: -0.01em; }
  .hero .sub { color: var(--ink-dim); font-size: 17px; margin-top: 18px; max-width: 46ch; }
  .hero .meta {
    margin-top: 28px; padding: 16px 18px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 14.5px; color: var(--ink-dim);
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  }
  .hero .meta strong { color: var(--ink); font-weight: 500; }

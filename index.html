<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitLine CRM</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        h1 { color: #2c3e50; margin-top: 0; margin-bottom: 15px; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
        h2 { color: #2c3e50; font-size: 16px; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #ddd; padding-bottom: 6px; }

        .dashboard { display: flex; flex-direction: column; gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .contact-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        
        .search-box { margin-bottom: 10px; }
        .search-box input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }

        .filter-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .filter-btn { background: #e0e0e0; color: #333; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .filter-btn.active { background: #2c3e50; color: white; }

        input, select, textarea, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
        
        button { background: #e67e22; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #d35400; }

        .import-phone-btn { background: #2980b9; margin-bottom: 5px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .import-phone-btn:hover { background: #1f618d; }

        .save-btn { background: #27ae60; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border-radius: 4px; border: none; color: white; font-weight: bold; cursor: pointer; padding: 10px; }
        .save-btn:hover { background: #219653; }

        .quick-task-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .quick-btn { background: #34495e; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; width: auto; }
        .quick-btn:hover { background: #2c3e50; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { border: 1px solid #e0e0e0; padding: 8px; text-align: left; vertical-align: middle; font-size: 12px; }
        th { background: #f8f9fa; color: #2c3e50; }
        
        tr.clickable td.client-name-cell { cursor: pointer; color: #2980b9; font-weight: bold; }
        tr.clickable td.client-name-cell:hover { text-decoration: underline; }

        .delete-btn { background: #e74c3c; padding: 8px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer; width: auto; margin: 0; }
        .delete-btn:hover { background: #c0392b; }
        
        .done { text-decoration: line-through; color: #888; }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: #fff; display: inline-block; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
        .date-small { font-size: 10px; color: #666; display: block; margin-top: 2px; }

        /* Modal Pop-up */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .close-modal:hover { background: #c0392b; }
        .section-box { background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #ddd; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>FitLine CRM</h1>

    <!-- 1. Neuer Kontakt -->
    <div class="card">
        <h2>Neuen Kontakt anlegen</h2>
        
        <button type="button" class="import-phone-btn" onclick="importFromPhoneContacts()">📇 Aus Handy-Telefonbuch wählen</button>

        <form class="contact-form" id="contactForm">
            <input type="text" id="contactName" placeholder="Name / Firma" required>
            <input type="text" id="contactChannel" placeholder="Kanal (Insta, Tel...)">
            <input type="text" id="contactPhone" placeholder="Telefon / E-Mail">
            
            <select id="contactType">
                <option value="Kunde">Kunde</option>
                <option value="Teampartner">Teampartner</option>
                <option value="Sonstiges">Sonstiges</option>
            </select>

            <select id="contactStatus">
                <option value="Unkontaktiert">Unkontaktiert</option>
                <option value="Kontaktiert">Kontaktiert</option>
                <option value="Interessiert">Interessiert</option>
                <option value="Später interessiert">Später interessiert</option>
                <option value="Kein Interesse">Kein Interesse</option>
            </select>

            <textarea id="contactNotes" placeholder="Notizen..." rows="2"></textarea>
            <button type="submit" class="save-btn">📇 Kontakt speichern & ins Handy übernehmen</button>
        </form>
    </div>

    <div class="dashboard">
        
        <!-- 2. Gesamtübersicht aller offenen Aufgaben -->
        <div class="card">
            <h2>📋 Alle offenen Aufgaben & Wiedervorlagen</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 25px; text-align: center;">✓</th>
                            <th>Aufgabe</th>
                            <th>Kunde</th>
                            <th>Fällig</th>
                            <th style="width: 35px;">X</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 3. Kontakte & Suche -->
        <div class="card">
            <h2>👥 Kontakte & Suche (Klick auf Namen öffnet Details & Aufgaben)</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Nach Namen, Telefon oder Kanal suchen..." oninput="render()">
            </div>

            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" onclick="setFilter('all')">Alle</button>
                <button class="filter-btn" onclick="setFilter('Unkontaktiert')">Unkontaktiert</button>
                <button class="filter-btn" onclick="setFilter('Kontaktiert')">Kontaktiert</button>
                <button class="filter-btn" onclick="setFilter('Interessiert')">Interessiert</button>
                <button class="filter-btn" onclick="setFilter('Später interessiert')">Später</button>
                <button class="filter-btn" onclick="setFilter('Kein Interesse')">Kein Interesse</button>
                <button class="filter-btn" onclick="setFilter('Kunde')">Kunden</button>
                <button class="filter-btn" onclick="setFilter('Teampartner')">Teampartner</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name / Firma</th>
                            <th>Typ</th>
                            <th>Status</th>
                            <th>Kanal</th>
                        </tr>
                    </thead>
                    <tbody id="contactTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- Modal Pop-up für Kundendetails & integrierte Aufgaben -->
<div class="modal-overlay" id="contactModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">X</button>
        <h2>🔍 Kundendetails & Aufgaben</h2>
        <div id="clientDetailContent"></div>
    </div>
</div>

<script>
    let contacts = JSON.parse(localStorage.getItem('fitline_crm_contacts_v12')) || [];
    let tasks = JSON.parse(localStorage.getItem('fitline_crm_tasks_v12')) || [];
    let currentFilter = 'all';
    let selectedContactIndex = null;

    const contactForm = document.getElementById('contactForm');
    const contactTableBody = document.getElementById('contactTableBody');
    const taskTableBody = document.getElementById('taskTableBody');
    const searchInput = document.getElementById('searchInput');
    const contactModal = document.getElementById('contactModal');
    const clientDetailContent = document.getElementById('clientDetailContent');

    function saveData() {
        localStorage.setItem('fitline_crm_contacts_v12', JSON.stringify(contacts));
        localStorage.setItem('fitline_crm_tasks_v12', JSON.stringify(tasks));
    }

    function render() {
        contactTableBody.innerHTML = '';

        const searchQuery = searchInput.value.toLowerCase().trim();

        let filteredContacts = contacts.map((c, originalIndex) => ({ ...c, originalIndex })).filter(c => {
            let matchesFilter = true;
            if (currentFilter !== 'all') {
                if (currentFilter === 'Kunde' || currentFilter === 'Teampartner') {
                    matchesFilter = c.type === currentFilter;
                } else {
                    matchesFilter = c.status === currentFilter;
                }
            }

            let matchesSearch = true;
            if (searchQuery) {
                const nameMatch = c.name && c.name.toLowerCase().includes(searchQuery);
                const phoneMatch = c.phone && c.phone.toLowerCase().includes(searchQuery);
                const channelMatch = c.channel && c.channel.toLowerCase().includes(searchQuery);
                matchesSearch = nameMatch || phoneMatch || channelMatch;
            }

            return matchesFilter && matchesSearch;
        });

        filteredContacts.forEach((c) => {
            let statusColor = '#95a5a6';
            if (c.status === 'Unkontaktiert') statusColor = '#e67e22';
            if (c.status === 'Kontaktiert') statusColor = '#3498db';
            if (c.status === 'Interessiert') statusColor = '#27ae60';
            if (c.status === 'Später interessiert') statusColor = '#f39c12';
            if (c.status === 'Kein Interesse') statusColor = '#7f8c8d';

            contactTableBody.innerHTML += `
                <tr class="clickable" onclick="openContact(${c.originalIndex})">
                    <td class="client-name-cell">
                        <strong>${c.name}</strong>
                        <span class="date-small">${c.createdDate}</span>
                    </td>
                    <td><strong>${c.type}</strong></td>
                    <td><span class="badge" style="background-color: ${statusColor};">${c.status}</span></td>
                    <td>${c.channel || '-'}</td>
                </tr>`;
        });

        if (filteredContacts.length === 0) {
            contactTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #888; padding: 15px;">Keine Kontakte gefunden.</td></tr>`;
        }

        tasks.sort((a, b) => new Date(a.date) - new Date(b.date));
        taskTableBody.innerHTML = '';
        tasks.forEach((t, index) => {
            taskTableBody.innerHTML += `
                <tr>
                    <td style="text-align: center;"><input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask(${index})" style="transform: scale(1.1);"></td>
                    <td class="${t.done ? 'done' : ''}">${t.text}</td>
                    <td><strong>${t.clientName}</strong></td>
                    <td class="${t.done ? 'done' : ''}">${t.date}</td>
                    <td><button class="delete-btn" onclick="deleteTask(${index})">X</button></td>
                </tr>`;
        });

        saveData();
    }

    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        render();
    }

    function openContact(index) {
        selectedContactIndex = index;
        const c = contacts[index];

        const clientTasks = tasks.map((t, tIndex) => ({ ...t, tIndex })).filter(t => t.clientName === c.name);

        let tasksHtml = '';
        if (clientTasks.length > 0) {
            clientTasks.forEach(t => {
                tasksHtml += `
                    <div style="display: flex; align-items: center; justify-content: space-between; background: white; padding: 6px 10px; border-radius: 4px; margin-bottom: 5px; border: 1px solid #ddd;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask(${t.tIndex}); openContact(${index});" style="transform: scale(1.1);">
                            <span class="${t.done ? 'done' : ''}" style="font-size: 12px;"><strong>${t.text}</strong> (${t.date})</span>
                        </div>
                        <button class="delete-btn" style="padding: 2px 6px; font-size: 10px;" onclick="deleteTask(${t.tIndex}); openContact(${index});">X</button>
                    </div>`;
            });
        } else {
            tasksHtml = `<div style="font-size: 12px; color: #7f8c8d; font-style: italic; margin-bottom: 8px;">Keine offenen Aufgaben für diesen Kunden.</div>`;
        }

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 3);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];

        clientDetailContent.innerHTML = `
            <button class="save-btn" style="margin-bottom: 12px;" onclick="exportVCardData('${c.name}', '${c.phone || ''}', '${c.type}', '${c.status}', '${c.notes || ''}')">📇 Erneut als Handykontakt speichern</button>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #555;">Name / Firma:</label>
                    <input type="text" value="${c.name}" onchange="updateContactField(${index}, 'name', this.value)">
                </div>
                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #555;">Kanal:</label>
                    <input type="text" value="${c.channel || ''}" onchange="updateContactField(${index}, 'channel', this.value)">
                </div>
                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #555;">Telefon / E-Mail:</label>
                    <input type="text" value="${c.phone || ''}" onchange="updateContactField(${index}, 'phone', this.value)">
                </div>
                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #555;">Typ:</label>
                    <select onchange="updateContactField(${index}, 'type', this.value)">
                        <option value="Kunde" ${c.type === 'Kunde' ? 'selected' : ''}>Kunde</option>
                        <option value="Teampartner" ${c.type === 'Teampartner' ? 'selected' : ''}>Teampartner</option>
                        <option value="Sonstiges" ${c.type === 'Sonstiges' ? 'selected' : ''}>Sonstiges</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #555;">Status:</label>
                    <select onchange="updateContactField(${index}, 'status', this.value)">
                        <option value="Unkontaktiert" ${c.status === 'Unkontaktiert' ? 'selected' : ''}>Unkontaktiert</option>
                        <option value="Kontaktiert" ${c.status === 'Kontaktiert' ? 'selected' : ''}>Kontaktiert</option>
                        <option value="Interessiert" ${c.status === 'Interessiert' ? 'selected' : ''}>Interessiert</option>
                        <option value="Später interessiert" ${c.status === 'Später interessiert' ? 'selected' : ''}>Später interessiert</option>
                        <option value="Kein Interesse" ${c.status === 'Kein Interesse' ? 'selected' : ''}>Kein Interesse</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 11px; font-weight: bold; color: #555;">Notizen:</label>
                    <textarea rows="2" onchange="updateContactField(${index}, 'notes', this.value)">${c.notes || ''}</textarea>
                </div>
            </div>

            <div class="section-box">
                <label style="font-size: 12px; font-weight: bold; color: #2c3e50; display: block; margin-bottom: 8px;">⚡ Aufgaben für diesen Kunden:</label>
                
                ${tasksHtml}

                <div style="font-size: 11px; font-weight: bold; color: #555; margin-top: 10px; margin-bottom: 4px;">Mit 1 Klick hinzufügen:</div>
                <div class="quick-task-bar">
                    <button class="quick-btn" type="button" onclick="addQuickTaskDirect('Nachfassen (3 Tage)', 3)">+ 3 Tage</button>
                    <button class="quick-btn" type="button" onclick="addQuickTaskDirect('Nachfassen (7 Tage)', 7)">+ 7 Tage</button>
                    <button class="quick-btn" type="button" onclick="addQuickTaskDirect('Nachfassen (14 Tage)', 14)">+ 14 Tage</button>
                    <button class="quick-btn" type="button" onclick="addQuickTaskDirect('Termin vereinbaren', 1)">+ Termin</button>
                    <button class="quick-btn" type="button" onclick="addQuickTaskDirect('Party eingeladen', 1)">+ Party</button>
                    <button class="quick-btn" type="button" onclick="addQuickTaskDirect('Call eingeladen', 1)">+ Call</button>
                    <button class="quick-btn" type="button" onclick="addQuickTaskDirect('Action Pack nachfassen', 3)">+ Action Pack</button>
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px; border-top: 1px dashed #ccc; padding-top: 10px;">
                    <div style="font-size: 11px; font-weight: bold; color: #555;">Oder eigene Aufgabe manuell eintragen:</div>
                    <div>
                        <input type="text" id="modalTaskText" placeholder="z. B. Unterlagen senden...">
                    </div>
                    <div>
                        <input type="date" id="modalTaskDate" value="${tomorrowStr}">
                    </div>
                    <button type="button" class="save-btn" onclick="addModalCustomTaskSubmit()">Aufgabe speichern</button>
                </div>
            </div>
        `;

        contactModal.style.display = 'flex';
    }

    function closeModal() {
        contactModal.style.display = 'none';
        render();
    }

    function updateContactField(index, field, value) {
        contacts[index][field] = value;
        saveData();
    }

    function addQuickTaskDirect(text, days) {
        if (selectedContactIndex === null) return;
        const client = contacts[selectedContactIndex];

        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + days);
        const dateString = targetDate.toISOString().split('T')[0];

        tasks.push({
            text: text,
            clientName: client.name,
            date: dateString,
            done: false
        });

        saveData();
        openContact(selectedContactIndex);
    }

    function addModalCustomTaskSubmit() {
        if (selectedContactIndex === null) return;
        const client = contacts[selectedContactIndex];
        const textInput = document.getElementById('modalTaskText');
        const dateInput = document.getElementById('modalTaskDate');

        // Fallback: Falls das Datumsfeld leer geblieben ist, nimm standardmäßig in 3 Tagen
        let taskDate = dateInput.value;
        if (!taskDate) {
            const fallbackDate = new Date();
            fallbackDate.setDate(fallbackDate.getDate() + 3);
            taskDate = fallbackDate.toISOString().split('T')[0];
        }

        if (!textInput.value.trim()) {
            alert('Bitte einen Text für die Aufgabe eingeben.');
            return;
        }

        tasks.push({
            text: textInput.value,
            clientName: client.name,
            date: taskDate,
            done: false
        });

        saveData();
        openContact(selectedContactIndex);
    }

    function exportVCardData(name, phone, type, status, notes) {
        const vcard = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            `FN:${name}`,
            `N:;${name};;;`,
            `TEL;TYPE=CELL:${phone}`,
            `NOTE:FitLine CRM - ${type} (${status}) ${notes}`,
            'END:VCARD'
        ].join('\n');

        const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `${name.replace(/[^a-zA-Z0-9]/g, '_')}.vcf`;
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
        URL.revokeObjectURL(url);
    }

    async function importFromPhoneContacts() {
        if (!('contacts' in navigator && 'ContactsManager' in window)) {
            alert('Dein Browser unterstützt den direkten Zugriff auf das Telefonbuch leider nicht.');
            return;
        }
        try {
            const props = ['name', 'tel', 'email'];
            const opts = { multiple: false };
            const selectedContacts = await navigator.contacts.select(props, opts);
            
            if (selectedContacts && selectedContacts.length > 0) {
                const phoneContact = selectedContacts[0];
                if (phoneContact.name && phoneContact.name[0]) {
                    document.getElementById('contactName').value = phoneContact.name[0];
                }
                if (phoneContact.tel && phoneContact.tel[0]) {
                    document.getElementById('contactPhone').value = phoneContact.tel[0];
                }
                document.getElementById('contactChannel').value = 'Telefon';
            }
        } catch (ex) {
            console.log('Fehler beim Auswählen des Kontakts:', ex);
        }
    }

    contactForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const today = new Date().toLocaleDateString('de-DE');
        
        const name = document.getElementById('contactName').value;
        const channel = document.getElementById('contactChannel').value;
        const phone = document.getElementById('contactPhone'].value;
        const type = document.getElementById('contactType').value;
        const status = document.getElementById('contactStatus').value;
        const notes = document.getElementById('contactNotes').value;

        contacts.push({
            name: name,
            channel: channel,
            phone: phone,
            type: type,
            status: status,
            notes: notes,
            createdDate: today
        });

        exportVCardData(name, phone, type, status, notes);
        document.getElementById('contactForm').reset();
        render();
    });

    function deleteTask(index) {
        tasks.splice(index, 1);
        saveData();
    }

    function toggleTask(index) {
        tasks[index].done = !tasks[index].done;
        saveData();
    }

    render();
</script>

</body>
</html>
